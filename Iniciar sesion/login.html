<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Iniciar Sesión</title>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="avatar">👤</div>
            <h2>Iniciar Sesión</h2>
            <p>Completa los datos para ingresar</p>
            
            <form>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" placeholder="Ingresa tu correo electrónico">
                
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••">
                <small>Mínimo 8 caracteres, con mayúscula y número.</small>
                
                <button type="submit" class="login-btn">Ingresar</button>
            </form>
            
            <a href="recuperar.html" class="forgot-password">¿Olvidaste tu contraseña?</a>
            <p class="register-text">¿No tienes cuenta? <a href="registro.html">Registrate</a></p>
        </div>
    </div>
</body>
</html>
