<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="recovery-card">
        <div class="icon">🔒</div>
        <h2>Recuperar contraseña</h2>
        <p>Se enviará un correo para reiniciar tu contraseña a tu dirección de email.</p>
        
        <form>
            <div class="form-group">
                <label>Correo electrónico:</label>
                <input type="email" placeholder="Ingresa tu correo electrónico">
            </div>
            
            <button type="button" class="btn btn-back" onclick="window.location.href='login.html'">Volver </button>
            <button type="button" class="btn btn-send" onclick="window.location.href='nueva_contrasena.html'">Enviar</button>
        </form>
    </div>

</body>
</html>
