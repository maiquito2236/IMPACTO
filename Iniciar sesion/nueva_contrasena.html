<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear nueva contraseña</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="password-card">
        <div class="avatar">👤</div>
        <h2>Crear nueva contraseña</h2>
        <p>Completa los campos para realizar el proceso de cambio de contraseña</p>
        
        <form>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" placeholder="Ingresa tu nueva contraseña">
            </div>
            
            <div class="form-group">
                <label>Confirmar contraseña:</label>
                <input type="password" placeholder="Confirma tu nueva contraseña">
            </div>
            
            <small>Mínimo 8 caracteres, con mayúscula y número.</small>
            
            <button type="button" class="btn-save" onclick="window.location.href='login.html'">Guardar</button>
        </form>
    </div>

</body>
</html>
